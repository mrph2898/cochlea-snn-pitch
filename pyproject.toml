[project]
name = "cochlea-snn-pitch"
version = "0.2.0"
description = "Cochlea-inspired spiking neural networks for noise-robust pitch perception: gammatone/IHC auditory front-end, SNN pitch classifiers (supervised surrogate-gradient & unsupervised STDP-WTA), and experiments toward an 'absolute pitch' (octave-invariant chroma) representation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cython>=3.2.4",
    "innuce-spikify>=1.1.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "snntorch>=0.9.4",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }   